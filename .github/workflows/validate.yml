name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository structure, skill frontmatter, evals, template lint
        run: python tools/validate_repo.py
      - name: Unit tests for the statistics tools
        run: python -m unittest discover -s tools -p "test_*.py" -v
      # MQL5 compilation needs Windows + MetaEditor; run tools/compile_mql5.py locally before a release.
